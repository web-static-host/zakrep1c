<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алгоритм закрепления 1С-ЭДО</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        
        <div class="content-split">
            
            <div class="left-panel">
                
                <div class="block instruction-block">
                    <h1 class="main-title">Алгоритм закрепления 1С-ЭДО и 1С-ЭПД</h1>
                    <div id="step-description" class="description-text"></div>
                </div>

                <div class="block question-block">
                    <h2 id="step-question">Загрузка...</h2>
                    <div id="options-grid" class="options-grid"></div>
                </div>

                <div class="block draft-block">
                    <div class="draft-header">
                        <span>Черновик</span>
                        <button id="btn-draft-clear" class="draft-btn">Очистить</button>
                    </div>
                    <textarea id="draft-input" placeholder="Сюда можно скопировать текст задачи или данные клиента..."></textarea>
                </div>

            </div>

            <div class="right-panel">
                <img id="step-image" src="" alt="Скриншот шага" style="display: none;">
            </div>

        </div>

        <footer>
            <button id="btn-back" class="nav-btn btn-text">← Назад</button>
            <button id="btn-restart" class="nav-btn btn-text">Начать заново ↻</button>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
